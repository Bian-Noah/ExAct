# ExAct 默认配置文件
# ★ llm.api_key 请手动填写为您的 MiniMax API Key（保持占位符时代码会校验，不可为空）
# 建议：复制此文件为 configs/local.yaml 并在 .gitignore 中忽略 local.yaml，可避免提交真实密钥

env:
  mode: direct                # "direct" | "gui"   是否开 GUI 窗口
  renderer: auto              # "auto" | "cpu" | "gpu"   渲染器选择(auto = 平台自动判断)
  camera_resolution: [640, 480]   # list，加载时转为 tuple[int, int]
  # iter11-reset-multicam:多相机配置,默认 1 个 overhead 相机
  # 场景对齐(openvla-scene-alignment):参数已针对"桌面顶 z=0.30,中心(0.5,0)"的桌面构图调整,
  # 经本地渲染验证(.local/render_check/*.png)对比确认。
  cameras:
    # OpenVLA 仅消费此图;target/distance/yaw/pitch 经过本地渲染(top.png)验证
    - name: observation.images.top
      target: [0.5, 0.0, 0.30]
      distance: 0.9
      yaw: 90
      pitch: -15
      roll: 0
      fov: 60
      resolution: [640, 480]
    # 侧视,提供臂与方块高度关系(给 LLM observe)
    - name: observation.images.side
      target: [0.5, 0.0, 0.30]
      distance: 1.0
      yaw: 90
      pitch: -20
      roll: 0
      fov: 60
      resolution: [640, 480]
    # 近景俯视工位:夹爪与方块居中(LLM 看到抓取目标姿态;非真 wrist 相机)
    - name: observation.images.wrist
      target: [0.5, 0.0, 0.34]
      distance: 0.35
      yaw: 90
      pitch: -40
      roll: 0
      fov: 75
      resolution: [256, 256]

vla:
  backend: mock                   # "mock" | "lerobot" | "openvla"（llm_vla/small_vla 规划中）
  model_path: null                # 仅 lerobot / openvla 需要，mock 设为 null
                                  #   lerobot 例: "lerobot/act_aloha_sim_transfer_cube_human"
                                  #             "lerobot/smolvla_base"
                                  #             "lerobot/pi0_libero_finetuned"
                                  #   openvla 例: "openvla/openvla-7b"
  # iter11-reset-multicam:max_steps 字段已删除(iter 10 后无消费方)
  mock:                           # 仅 backend: mock 时生效（mock 特化配置）
    variant: task                 # task | joint
                                  #   task:  默认 7 维 task 空间（MockVLA，用于 Panda）
                                  #   joint: 6 维 joint 空间（JointMockVLA，用于 so101）
  lerobot:                        # 仅 backend: lerobot 时生效（policy 特化配置）
    policy_type: act              # act | diffusion | smolvla | pi0 | vqbet | pi0fast
    device: "cuda:0"              # 推理设备
    quantization: none            # none | 8bit | 4bit（仅 VLA 类生效：smolvla/pi0/pi0fast）
                                  #   smolvla: 4bit ~2GB 推理显存，8GB 卡 4bit 或 none 均可
                                  #   pi0:     fp16 ~14GB 装不下，8GB 卡必须 4bit（~4GB）
    # image_key: "observation.images.top"   # 可选，默认加载后从 policy.config 自动探测
    # action_dim: 14               # 可选，policy 输出维度，>7 时截前 7 维
  openvla:                        # 仅 backend: openvla 时生效（OpenVLA-7B 特化配置）
    unnorm_key: "bridge_orig"     # 反归一化键，决定动作量纲与顺序（LIBERO 微调版需核对）
    attn_impl: "flash_attention_2"  # flash_attention_2 | eager（缺 flash-attn 自动回退）
    device: "cuda:0"              # 推理设备（4bit 量化时走 device_map）
    dtype: "bfloat16"             # bfloat16 | float16 | float32
    quantization: "4bit"          # 4bit（bnb nf4，4060 ~4GB）| none（bf16 需 16GB+ 显存）

llm:
  api_key: "YOUR_API_KEY_HERE"    # ★ 用户手动填写，提交代码时保持占位符
  model: "MiniMax-M3"
  base_url: "https://api.minimax.chat/v1"
  max_tokens: 2048

explore:
  enabled: false                  # 是否启用 Explore（关闭时不构造 Explore，不挂 ExploreTool）
  root: "data/explore"            # 探索笔记落盘根目录（相对项目根）

robot:
  type: panda                     # 机器人类型分派（env/robot/<type>/ 下加载对应 Robot）
  urdf_path: "franka_panda/panda.urdf"   # 顶层公共字段（所有机器人通用）
  base_position: [0.0, 0.0, 0.0]
  panda:                          # Panda 特化配置（robot.type=panda 时生效）
    arm_joint_indices: [0, 1, 2, 3, 4, 5, 6]
    ee_link_index: 11
    finger_joint_indices: [9, 10]
  so101:                          # SO101 特化配置（robot.type=so101 时生效）
    arm_joint_indices: [0, 1, 2, 3, 4, 5]
    ee_link_index: 6
  widowx:                         # WidowX 特化配置（robot.type=widowx 时生效）
    arm_joint_indices: [0, 1, 2, 3, 4]    # 5 臂关节（wx250.urdf）
    ee_link_index: 11                     # /ee_gripper_link
    gripper_joint_indices: [9, 10]        # 夹爪 2 指
    # urdf_url / urdf_local_path 默认即可；切换 widowx 时顶层 urdf_path 须指向
    # "robot/widowx/wx250.urdf"（与 urdf_local_path 一致），首次运行自动下载

task:
  default_user_goal: "把机械臂移到红色方块上方"
  objects:
    - type: cube
      # 场景对齐(openvla-scene-alignment):cube 落在桌面顶 0.30 + 0.05 余量(半 cube 高 0.025)
      # 与 src/env/pybullet_env.py 模块常量 TABLE_TOP_Z 人工同步
      pos: [0.5, 0, 0.35]
      color: red

agent:
  max_react_rounds: 5
  max_tool_calls: 3
  # extra_prompt: ""   # 额外提示词（可选）:替换系统提示词中的"后端模型/运行策略"说明段,
                       # 通用段与报告契约保持固定。空 = 用历史完整提示词,行为不变。
                       # 多行文本用 yaml | 块,例如:
                       # extra_prompt: |
                       #   本场景运行 OpenVLA(bridge_orig)...

experiment:
  enabled: true                  # Iteration 3 启用：开启后每次跑 pipeline 自动落盘到 data/experiment/{timestamp}/
  root: "data/experiment"        # 实验产物根目录（相对项目根）
  log_to_stdout: true            # log 事件是否同时输出到终端
  # iter12-video-recording:实验过程视频录制配置
  # 每次实验在 {exp_dir}/process/ 下产出单个 mp4,覆盖 reset → pipeline 结束的物理步进过程
  video:
    enabled: true                # 视频录制总开关;False 时不创建 process/、不抓帧
    filename: "demo.mp4"         # process/ 下输出文件名
    fps: 15                      # 视频文件帧率标签（播放速度,与物理步进 240Hz 解耦）
    resolution: [640, 480]       # 抓帧分辨率,必须为偶数宽高（mp4v 编码器要求）
    camera: null                 # 使用哪个相机名（env.cameras 中的 name）;null = 第一个相机
    capture_every_n_steps: 1     # 每 N 个物理子步抓 1 帧（默认 1=每子步;调大可降低 CPU 渲染开销）

image_store:
  backend: "memory"            # "memory" | "file"
  file_dir: "data/images"      # FileBackend root_dir / MemoryBackend spill dir（相对项目根）
  max_memory_items: 10         # MemoryBackend 内存上限（条目数），超出后 spill 到 file_dir
